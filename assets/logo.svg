<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PapiDuo — « le dé du duo » : un dé en papier quadrillé, face 2, un point par joueur (rouge / bleu). -->
  <defs>
    <clipPath id="pdFace"><rect x="86" y="76" width="340" height="340" rx="64"/></clipPath>
  </defs>
  <g transform="rotate(-8 256 256)" stroke-linejoin="round">
    <!-- épaisseur du dé -->
    <rect x="86" y="96" width="340" height="340" rx="64" fill="#c6d6ea" stroke="#1d2533" stroke-width="9"/>
    <!-- face : papier quadrillé + marge rouge du cahier -->
    <rect x="86" y="76" width="340" height="340" rx="64" fill="#f3f7fc"/>
    <g clip-path="url(#pdFace)">
      <g stroke="#d3e0f0" stroke-width="3">
        <path d="M120 0V512M154 0V512M188 0V512M222 0V512M256 0V512M290 0V512M324 0V512M358 0V512M392 0V512"/>
        <path d="M0 110H512M0 144H512M0 178H512M0 212H512M0 246H512M0 280H512M0 314H512M0 348H512M0 382H512"/>
      </g>
      <path d="M110 0V512" stroke="#e23b3b" stroke-opacity=".5" stroke-width="5"/>
    </g>
    <rect x="86" y="76" width="340" height="340" rx="64" fill="none" stroke="#1d2533" stroke-width="9"/>
    <!-- les deux joueurs -->
    <circle cx="182" cy="172" r="48" fill="#e23b3b" stroke="#1d2533" stroke-width="8"/>
    <circle cx="330" cy="320" r="48" fill="#2563d9" stroke="#1d2533" stroke-width="8"/>
    <ellipse cx="166" cy="154" rx="15" ry="10" fill="#fff" opacity=".4" transform="rotate(-35 166 154)"/>
    <ellipse cx="314" cy="302" rx="15" ry="10" fill="#fff" opacity=".4" transform="rotate(-35 314 302)"/>
  </g>
</svg>
